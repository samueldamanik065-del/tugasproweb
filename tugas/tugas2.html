<!DOCTYPE html>
<html>
<head>
    <title>Form Data Mahasiswa</title>
    <link rel="stylesheet" type="text/css" href="form.css">
</head>
<body>

    <h2>Form Data Mahasiswa Fasilkomti</h2>

    <form>
        <label>Nama</label><br>
        <input type="text" name="nama"><br><br>

        <label>NIM</label><br>
        <input type="text" name="nim"><br><br>

        <label>Password</label><br>
        <input type="text" name="password"><br><br>

        <label>Jurusan</label><br>
        <select name="jurusan">
            <option value="Teknologi Informasi">Teknologi Informasi</option>
            <option value="Ilmu Komputer">Ilmu Komputer</option>
        </select><br><br>

        <label>Jenis Kelamin</label><br>
        <input type="radio" name="lk" value="L"> Laki-laki
        <input type="radio" name="p" value="P"> Perempuan<br><br>

        <label>Hobi:</label><br>
        <input type="checkbox" name="hobi" value="Coding"> Coding
        <input type="checkbox" name="hobi" value="Futsal"> Futsal
        <input type="checkbox" name="hobi" value="Lari"> Lari
        <input type="checkbox" name="hobi" value="Renang"> Renang
        <input type="checkbox" name="hobi" value="Gaming"> Gaming<br><br>

        <label>Alamat</label><br>
        <textarea name="alamat" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Kirim">
    </form>


    <p>Klik link kalkulator di bawah</p>
    <a href="kalkulator.html">Kalkulator</a>

</body>
</html>
